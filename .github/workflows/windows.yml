name: Windows EXE bauen
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhaengigkeiten installieren
        run: python -m pip install pyinstaller psutil
      - name: Windows-App bauen
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name EWDX-Monitor --add-data "web;web" --collect-all psutil app.py
      - name: EXE als ZIP bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: EWDX-Monitor-Windows
          path: dist/EWDX-Monitor/
          retention-days: 7
